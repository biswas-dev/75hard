# 75hard.biswas.me — host nginx, in front of the container on 127.0.0.1:13431.
#
# Install:  sudo cp deployment/nginx-ssl.conf /etc/nginx/sites-enabled/75hard.biswas.me
#           sudo nginx -t && sudo nginx -s reload
#
# TLS is a Cloudflare Origin Certificate (15-year), not certbot — matching the
# other apps on this host. Create it in the Cloudflare dashboard under
# SSL/TLS -> Origin Server for the biswas.me zone, then save the two PEM blocks
# to the paths below and chmod 600 the key.

limit_req_zone $binary_remote_addr zone=h75_api:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=h75_auth:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name 75hard.biswas.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 75hard.biswas.me;

    ssl_certificate     /etc/ssl/75hard.biswas.me/origin-cert.pem;
    ssl_certificate_key /etc/ssl/75hard.biswas.me/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # No ssl_session_cache here on purpose: a shared zone is global to nginx,
    # and declaring "SSL" with a different size than another site on this host
    # already uses makes the whole config fail to load. Session caching is set
    # once, at http level, for every site.

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/75hard.biswas.me_access.log;
    error_log  /var/log/nginx/75hard.biswas.me_error.log;

    # Progress photos are compressed in the browser to a few hundred KB, but
    # leave room for an uncompressed original from an old device.
    client_max_body_size 20M;

    # Friendly page while a deploy recreates the container.
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        default_type text/html;
        return 503 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Updating</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#08080a;color:#d9d9e2;font-family:-apple-system,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}h1{color:#ff6b35;font-weight:600}</style></head><body><div><h1>Updating 75 Hard</h1><p>Back in a moment.</p></div></body></html>';
    }

    # Sign-in endpoints get the tighter bucket: this is where credential
    # stuffing shows up.
    location ~ ^/api/auth {
        limit_req zone=h75_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:13431;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location /api/ {
        limit_req zone=h75_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:13431;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # Photo uploads on a slow phone connection need room.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    location /health {
        proxy_pass http://127.0.0.1:13431;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:13431;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
