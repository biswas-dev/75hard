services:
  75hard:
    image: harbor.biswas.me/biswas/75hard:x64-latest
    ports:
      # Bound to loopback; host nginx terminates TLS and proxies here.
      - "127.0.0.1:13431:8080"
    volumes:
      - ./data:/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
